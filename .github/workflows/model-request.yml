name: Model request automation
on:
  issues:
    types: [opened, edited, labeled]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'model')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: model
        run: node scripts/model-request-tools.mjs
      - uses: actions/github-script@v7
        env:
          MODEL_REPORT: ${{ steps.model.outputs.report }}
        with:
          script: |
            const marker = "<!-- model-request-validator -->"; const body = `${marker}\n${process.env.MODEL_REPORT}`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const previous = comments.find(comment => comment.body?.includes(marker));
            const payload = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (previous) await github.rest.issues.updateComment({ ...payload, comment_id: previous.id });
            else await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });
      - if: steps.model.outputs.valid == 'true' && github.event.action == 'labeled' && github.event.label.name == 'model-ready'
        run: node scripts/model-request-tools.mjs --append
      - if: steps.model.outputs.valid == 'true' && github.event.action == 'labeled' && github.event.label.name == 'model-ready'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/model-request-${{ github.event.issue.number }}
          title: "data: add model request #${{ github.event.issue.number }}"
          commit-message: "data: add model request #${{ github.event.issue.number }}"
          body: "Closes #${{ github.event.issue.number }}. Generated from validated model and license sources."
          labels: data,model
