name: Data health

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit schemas, sources, duplicates, and translations
        id: audit
        continue-on-error: true
        run: |
          node scripts/data-audit.mjs --json > data-health.json
          node scripts/data-audit.mjs
      - name: Upload audit report
        uses: actions/upload-artifact@v6
        with:
          name: data-health
          path: data-health.json
      # lychee runs from a shared CI IP with a generic bot user-agent, which a
      # number of vendor/doc sites reject outright (403/401/429) even though
      # the pages are live and correct for real visitors. Domains below are
      # excluded because they've been manually verified reachable (Intel Arc
      # Pro spec pages, OpenAI's gpt-oss post) or intentionally gated
      # (private Hugging Face repos return 401 to anonymous requests) or
      # rate-limit aggressively (gnu.org). This list should stay narrow and
      # each entry should be re-verified before being added.
      - name: Check source links
        id: links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 5 --retry-wait-time 5 --max-concurrency 16 --timeout 30 --exclude 'https?://(search|prod)\.danawa\.com' --exclude 'https?://(www\.)?intel\.com' --exclude 'https?://(www\.)?openai\.com' --exclude 'https?://huggingface\.co' --exclude 'https?://(www\.)?gnu\.org' README.md README.en.md data/*.js
          fail: true
      - name: Check priority manufacturer specifications
        id: official
        continue-on-error: true
        run: node scripts/official-source-audit.mjs --remote > official-source-health.json
      - name: Upload official source report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: official-source-health
          path: official-source-health.json
      - name: Open or update a maintenance issue
        if: steps.audit.outcome == 'failure' || steps.links.outcome == 'failure' || steps.official.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Automated data health audit needs attention";
            const body = [
              "The scheduled v2.0 data audit found a schema, translation, duplicate, or source-link problem.",
              "",
              `- Data audit: **${{ steps.audit.outcome }}**`,
              `- Link audit: **${{ steps.links.outcome }}**`,
              `- Priority official specs: **${{ steps.official.outcome }}**`,
              "",
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", per_page: 100,
            });
            const existing = open.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
      - name: Close maintenance issue once health is restored
        if: steps.audit.outcome == 'success' && steps.links.outcome == 'success' && steps.official.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Automated data health audit needs attention";
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", per_page: 100,
            });
            const existing = open.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Data audit, link audit, and priority official specs all passed on this run. Closing.\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: "closed" });
            }
      - name: Fail after reporting
        if: steps.audit.outcome == 'failure' || steps.links.outcome == 'failure' || steps.official.outcome == 'failure'
        run: exit 1
