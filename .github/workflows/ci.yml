name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  calculations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run calculation test batch ${{ matrix.batch }}
        run: node scripts/run-tests.mjs --batch=${{ matrix.batch }}

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:static
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.61.1
          npx playwright install chromium
      - run: npm run test:visual
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-regression-screenshots
          path: outputs/ui-regression
