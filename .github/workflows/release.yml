name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6

      - name: Verify package version matches tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "${notes_file}" ]; then
            echo "# ${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"
            echo "" >> "${RUNNER_TEMP}/release-notes.md"
            echo "See CHANGELOG.md for details." >> "${RUNNER_TEMP}/release-notes.md"
            notes_file="${RUNNER_TEMP}/release-notes.md"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME} — AI Infra Sizing" \
            --notes-file "${notes_file}"
