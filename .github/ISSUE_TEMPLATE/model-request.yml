name: Model request
description: AI 모델 카탈로그 추가를 요청합니다.
title: "[MODEL] "
labels: ["data", "model"]
body:
  - type: checkboxes
    id: duplicate_check
    attributes:
      label: 중복 확인
      description: 사이트 검색과 기존 이슈 검색에서 같은 모델·별칭이 없는지 확인해 주세요.
      options:
        - label: 같은 모델 또는 진행 중인 요청이 없음을 확인했습니다.
          required: true
  - type: input
    id: name
    attributes:
      label: 모델 이름
      placeholder: Whisper large-v3
    validations:
      required: true
  - type: dropdown
    id: workload
    attributes:
      label: 워크로드
      options: [생성형 LLM, 임베딩, 리랭커, OCR/VLM, 이미지 생성, 비디오 생성, 아바타·립싱크, 음성 인식 STT, 음성 합성 TTS]
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: 제공자
      placeholder: OpenAI
    validations:
      required: true
  - type: input
    id: params
    attributes:
      label: 파라미터 수
      placeholder: 1.55B
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 라이선스
      placeholder: MIT
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: 언어
      placeholder: multilingual, Korean
  - type: input
    id: use_cases
    attributes:
      label: 주요 용도
      description: 쉼표로 구분해 적어 주세요.
      placeholder: 일반 대화, 코딩, RAG, 음성 복제, 실시간 자막
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 요약
      placeholder: 모델 용도와 특징을 간단히 적어 주세요.
  - type: input
    id: source
    attributes:
      label: 공식 모델 카드
      placeholder: https://huggingface.co/openai/whisper-large-v3
    validations:
      required: true
  - type: input
    id: license_source
    attributes:
      label: 라이선스 출처
      placeholder: https://huggingface.co/.../blob/main/LICENSE
    validations:
      required: true
