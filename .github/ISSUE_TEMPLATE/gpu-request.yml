name: GPU request
description: 새 GPU 프리셋 추가를 요청합니다.
title: "[GPU] "
labels: ["data", "gpu"]
body:
  - type: input
    id: gpu_name
    attributes:
      label: GPU 이름
      placeholder: GeForce RTX 4090 24GB
    validations:
      required: true
  - type: dropdown
    id: vendor
    attributes:
      label: 제조사
      options: [NVIDIA, AMD, Intel, Apple, 기타]
    validations:
      required: true
  - type: dropdown
    id: memory_type
    attributes:
      label: 메모리 유형
      options: [전용 VRAM, 통합메모리, 여러 GPU 합산]
    validations:
      required: true
  - type: input
    id: vram
    attributes:
      label: VRAM
      placeholder: 24GB
    validations:
      required: true
  - type: input
    id: bandwidth
    attributes:
      label: 메모리 대역폭
      placeholder: 1008 GB/s
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: 권장 시스템 RAM
      placeholder: 64GB
  - type: input
    id: usable_memory
    attributes:
      label: GPU 실제 할당 가능 메모리
      description: 통합메모리 제품은 BIOS/OS 설정에서 GPU에 할당 가능한 용량을 적어 주세요.
      placeholder: 96GB
  - type: input
    id: aliases
    attributes:
      label: 별칭·검색어
      placeholder: AI Max 395, Radeon 8060S, Strix Halo
  - type: checkboxes
    id: runtimes
    attributes:
      label: 확인된 실행 환경
      options:
        - label: CUDA
        - label: ROCm
        - label: Vulkan
        - label: Metal / MLX
        - label: DirectML
        - label: OpenVINO / oneAPI
  - type: input
    id: system
    attributes:
      label: 확인 환경
      placeholder: Windows 11 / Linux, 드라이버 버전, 노트북 TGP
  - type: textarea
    id: source
    attributes:
      label: 출처
      description: 제조사 제품 페이지나 신뢰 가능한 스펙 링크를 적어 주세요.
    validations:
      required: true
