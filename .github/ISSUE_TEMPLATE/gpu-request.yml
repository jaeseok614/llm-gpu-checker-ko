name: GPU request
description: GPU 프리셋 추가를 요청합니다.
title: "[GPU] "
labels: ["data", "gpu"]
body:
  - type: checkboxes
    id: duplicate_check
    attributes:
      label: 중복 확인
      description: 사이트 검색과 기존 이슈 검색에서 같은 GPU·별칭이 없는지 확인해 주세요.
      options:
        - label: 같은 GPU 또는 진행 중인 요청이 없음을 확인했습니다.
          required: true
  - type: input
    id: gpu_name
    attributes:
      label: GPU 이름
      placeholder: GeForce RTX 4090 24GB
    validations:
      required: true
  - type: dropdown
    id: vendor
    attributes:
      label: 제조사
      options: [NVIDIA, AMD, Intel, Apple, Other]
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: 아키텍처
      placeholder: Ada Lovelace
  - type: dropdown
    id: memory_type
    attributes:
      label: 메모리 유형
      options: [전용 VRAM, 통합 메모리]
    validations:
      required: true
  - type: dropdown
    id: form_factor
    attributes:
      label: 폼팩터
      options: [데스크톱, 노트북, 데이터센터, 통합 메모리]
    validations:
      required: true
  - type: input
    id: vram
    attributes:
      label: VRAM
      placeholder: 24GB
    validations:
      required: true
  - type: input
    id: bandwidth
    attributes:
      label: 메모리 대역폭
      placeholder: 1008 GB/s
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: 권장 시스템 RAM
      placeholder: 64GB
  - type: input
    id: usable_memory
    attributes:
      label: GPU 실제 할당 가능 메모리
      description: 통합 메모리 제품은 GPU에 실제로 할당할 수 있는 용량을 적어 주세요.
      placeholder: 96GB
  - type: input
    id: tgp_min
    attributes:
      label: 최소 TGP
      placeholder: 노트북 GPU만 입력, 예: 80W
  - type: input
    id: tgp_max
    attributes:
      label: 최대 TGP
      placeholder: 노트북 GPU만 입력, 예: 175W
  - type: input
    id: board_power
    attributes:
      label: 소비전력
      placeholder: 450W
  - type: input
    id: msrp
    attributes:
      label: 출시 가격
      placeholder: 1599 USD
  - type: input
    id: aliases
    attributes:
      label: 별칭·검색어
      placeholder: RTX4090, 4090
  - type: checkboxes
    id: runtimes
    attributes:
      label: 확인된 실행 환경
      options:
        - label: CUDA
        - label: ROCm
        - label: Vulkan
        - label: Metal / MLX
        - label: DirectML
        - label: OpenVINO / oneAPI
  - type: textarea
    id: source
    attributes:
      label: 출처
      description: NVIDIA, AMD, Intel, Apple의 공식 제품 사양 HTTPS 링크를 적어 주세요.
    validations:
      required: true
